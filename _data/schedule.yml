# MAAG 2027 schedule.
#
# SINGLE TRACK -- there are no parallel sessions. Each day is a flat, ordered
# list of slots, so overlapping talks are not representable by construction.
#
# Each slot needs `start`, `end`, `kind`, and exactly ONE of:
#   title:    free text (breaks, meals, logistics)
#   speaker:  a `ref` from a file in _speakers/
#   session:  a `ref` from a file in _workshop/
#
# `kind` is one of: logistics | talk | workshop | poster | break | social
# `room` is optional and only needed when a slot is NOT in the day's default
# room -- it renders as a small inline note.

