{%- comment -%}
  MAAG mark: the tropical curve dual to a unimodular triangulation of the
  degree-5 triangle -- the same motif as the 2018 MAAG logo, redrawn as vector
  art in the site palette. Grey polygons are the triangulation; the heavy
  path is the dual curve, with its unbounded rays in the three primitive
  directions.

  Generated, not hand-written. Colour comes from `currentColor`, so
  _sass/_hero.scss controls it. Decorative: the parent marks it aria-hidden.
{%- endcomment -%}
